<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Silent Camera</title>
  <meta name="description" content="Silentium est — A photography showcase by The Silent Camera">
  <link rel="icon" type="image/svg+xml" href="logos/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="logos/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="logos/favicon-16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <img src="logos/silent-camera-logo.svg" alt="The Silent Camera" class="logo" width="48" height="48">
      </a>
      <div class="tagline">Silentium est</div>
    </div>
  </header>

  <main>
    <div class="gallery" id="gallery"></div>
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-ring"></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&#8250;</button>
    <div class="lightbox-image-wrap">
      <img class="lightbox-image" id="lightbox-image" src="" alt="">
    </div>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <img src="logos/silent-camera-logo-mono.svg" alt="" class="footer-logo" width="24" height="24">
      <span class="footer-text">&copy; The Silent Camera</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
